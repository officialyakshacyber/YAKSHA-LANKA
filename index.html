<!doctype html>
<html lang="si">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080b12">
<meta name="description" content="Sri Lanka's history, heritage, Ravana traditions and AI research assistant.">
<title>YAKSHA — The Sri Lankan Heritage Archive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Noto+Sans+Sinhala:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{--bg:#080b12;--panel:#101722;--panel2:#141e2b;--line:#253344;--cyan:#54e6e0;--gold:#e9bb76;--white:#f3f5f7;--muted:#a4b0bf;--serif:Georgia,serif}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--white);font-family:"DM Sans","Noto Sans Sinhala",sans-serif;line-height:1.7}
a{color:inherit}
.container{width:min(1240px,92%);margin:auto}
.top{position:sticky;top:0;z-index:50;background:#080b12eF;backdrop-filter:blur(18px);border-bottom:1px solid #ffffff14}
.topin{height:76px;display:flex;align-items:center;justify-content:space-between;gap:22px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none}
.flagwave{width:58px;height:30px;display:inline-block;perspective:120px;overflow:hidden;filter:drop-shadow(0 0 8px #e9bb7666)}
.flagwave img{width:100%;height:100%;object-fit:cover;animation:flagWave 2.1s ease-in-out infinite;transform-origin:left center}
@keyframes flagWave{0%,100%{transform:rotateY(-13deg)}50%{transform:rotateY(18deg) skewY(2deg)}}
@media(prefers-reduced-motion:reduce){.flagwave img{animation:none}}
.brandmark{width:39px;height:39px;border:1px solid var(--gold);border-radius:50%;display:grid;place-items:center;color:var(--gold);font-size:22px}
.brandname{font-size:15px;letter-spacing:3px;font-weight:800}
.brandname small{display:block;font-size:9px;letter-spacing:2.5px;color:var(--muted);font-weight:500}
.nav{display:flex;gap:23px;align-items:center}
.nav a{text-decoration:none;color:#b9c4d0;font-size:13px}
.nav a:hover{color:var(--gold)}
button{font:inherit;cursor:pointer}
.lang,.outline{border:1px solid #516171;background:transparent;color:var(--white);padding:8px 13px;border-radius:5px;font-size:12px}
.hero{position:relative;min-height:640px;display:flex;align-items:center;overflow:hidden;border-bottom:1px solid #ffffff14;background:linear-gradient(90deg,#080b12 0%,#080b12ee 43%,#080b1266 100%),url('https://commons.wikimedia.org/wiki/Special:FilePath/Sigiriya_from_Pidurangala_2023.jpg') center/cover}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,var(--bg),transparent 40%),linear-gradient(90deg,transparent 50%,#080b1244)}
.hero .container{position:relative;z-index:2;padding:85px 0}
.kicker{color:var(--gold);font-size:11px;letter-spacing:4px;text-transform:uppercase}
.hero h1{font-family:var(--serif);font-weight:500;font-size:clamp(45px,7vw,90px);line-height:1.06;max-width:800px;margin:18px 0}
.hero p{max-width:610px;color:#c0cad5;font-size:16px}
.goldline{width:68px;height:2px;background:var(--gold);margin:26px 0}
.actions{display:flex;gap:12px;flex-wrap:wrap}
.primary{border:1px solid var(--gold);background:var(--gold);color:#17130d;padding:12px 19px;border-radius:4px;font-weight:700;font-size:13px}
.primary:hover{background:#f4d5a6}
.outline:hover,.lang:hover{border-color:var(--gold);color:var(--gold)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid #ffffff16}
.stat{padding:25px 18px;border-right:1px solid #ffffff16}
.stat:last-child{border:0}
.stat b{display:block;font:32px var(--serif);color:var(--gold)}
.stat span{font-size:11px;letter-spacing:1px;color:var(--muted)}
section{padding:82px 0}
.sectionhead{display:flex;justify-content:space-between;align-items:end;gap:25px;margin-bottom:28px}
.eyebrow{color:var(--gold);font-size:10px;letter-spacing:3px;text-transform:uppercase}
.sectionhead h2{font:42px/1.2 var(--serif);font-weight:500;margin:8px 0}
.sectionhead p{max-width:520px;color:var(--muted);font-size:13px;margin:0}
.filterbar{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0}
.filterbar button{background:#111925;border:1px solid var(--line);color:#b7c3cf;padding:8px 13px;border-radius:30px;font-size:11px}
.filterbar button.active,.filterbar button:hover{background:#25302f;border-color:var(--gold);color:var(--gold)}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.card{background:var(--panel);border:1px solid #ffffff14;overflow:hidden;transition:.25s;cursor:pointer}
.card:hover{transform:translateY(-5px);border-color:#c9a66e88;box-shadow:0 18px 38px #0008}
.photo{height:220px;position:relative;background:#182432;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s}
.card:hover .photo img{transform:scale(1.06)}
.photo:after{content:"";position:absolute;inset:45% 0 0;background:linear-gradient(transparent,#101722)}
.period{position:absolute;z-index:2;left:15px;bottom:12px;background:#080b12cc;border:1px solid #ffffff2a;padding:4px 9px;font-size:10px;color:var(--gold)}
.cardbody{padding:18px 19px 20px}
.cardbody h3{font:24px/1.25 var(--serif);font-weight:500;margin:0 0 8px}
.cardbody p{font-size:12px;color:var(--muted);margin:0 0 15px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.read{color:var(--gold);font-size:11px;letter-spacing:1px;text-transform:uppercase}
.split{display:grid;grid-template-columns:1fr 1fr;gap:50px;align-items:center}
.featureimg{min-height:430px;background:#111 url('https://commons.wikimedia.org/wiki/Special:FilePath/Ravana_statue.jpg') center/cover;position:relative}
.featureimg:after{content:"";position:absolute;inset:0;border:1px solid #e9bb7666;transform:translate(13px,13px);pointer-events:none}
.split h2{font:44px/1.2 var(--serif);font-weight:500}
.split p{color:var(--muted);font-size:14px}
.callout{border-left:2px solid var(--gold);padding:15px 18px;background:#e9bb760c;color:#c5ced8;font-size:13px;margin:22px 0}
.sourcegrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.source{padding:17px;border:1px solid var(--line);background:var(--panel);text-decoration:none}
.source b{display:block;color:var(--gold);font:19px var(--serif)}
.source span{color:var(--muted);font-size:11px}
.footer{border-top:1px solid #ffffff17;padding:35px 0;color:var(--muted);font-size:11px}
.modal{position:fixed;inset:0;z-index:100;background:#020408eF;display:none;overflow:auto;padding:30px 15px}
.modal.open{display:block}
.modalbox{width:min(900px,100%);margin:20px auto;background:#101722;border:1px solid #4b5b68;position:relative}
.modalimg{height:min(48vw,400px);min-height:210px;background:#1a2735}
.modalimg img{width:100%;height:100%;object-fit:cover}
.modaltext{padding:clamp(20px,4vw,42px)}
.modaltext h2{font:clamp(30px,5vw,46px) var(--serif);font-weight:500;margin:4px 0 10px}
.modaltext p{color:#c2ccd6;font-size:14px;line-height:1.95}
.close{position:sticky;top:8px;float:right;margin:8px 8px -55px 0;z-index:3;background:#080b12;border:1px solid #ffffff66;color:white;width:40px;height:40px;border-radius:50%;font-size:20px}
.modalmeta{color:var(--gold);font-size:11px;letter-spacing:1px}
.galleryhead{font:25px var(--serif);margin:30px 0 12px}
.gallerygrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.galleryitem{margin:0;background:#0a111b;border:1px solid #2b3b4b;overflow:hidden}
.galleryitem img{width:100%;height:210px;object-fit:cover;display:block}
.galleryitem figcaption{padding:9px 11px;font-size:11px;color:#c4ced8}
.galleryitem a{color:var(--gold);font-size:10px}
.gallerystatus{color:var(--muted);font-size:12px}
.videolink{display:inline-block;margin:12px 0 0;padding:10px 14px;border:1px solid var(--gold);color:var(--gold);text-decoration:none;font-size:12px}
.chatstatus{padding:8px 14px;color:#a4b0bf;font-size:10px;border-bottom:1px solid #ffffff12}
.chatstatus.ok{color:#8bd8a7}
.chatstatus.bad{color:#ffb4a9}
.chatlauncher{position:fixed;right:24px;bottom:22px;z-index:70;background:var(--gold);color:#18130d;border:0;border-radius:50px;padding:13px 20px;font-weight:800;box-shadow:0 8px 30px #0009}
.chat{position:fixed;z-index:80;right:20px;bottom:20px;width:min(410px,calc(100vw - 28px));background:#0c121c;border:1px solid #617080;box-shadow:0 25px 80px #000c;display:none}
.chat.open{display:block}
.chathead{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:#151f2b;border-bottom:1px solid #ffffff1a}
.chathead b{font:20px var(--serif);font-weight:500}
.chathead small{display:block;color:var(--muted);font:10px "DM Sans",sans-serif;letter-spacing:1px}
.chatbody{height:360px;overflow:auto;padding:14px}
.bubble{max-width:94%;padding:10px 12px;margin:8px 0;font-size:12px;white-space:pre-wrap;line-height:1.7}
.bubble.ai{background:#182535;border-left:2px solid var(--gold)}
.bubble.me{background:#253d42;margin-left:auto}
.chatinput{display:flex;gap:8px;padding:12px;border-top:1px solid #ffffff1a}
.chatinput input{flex:1;min-width:0;background:#080e17;border:1px solid #344455;padding:11px;color:white}
.chatinput button{background:var(--gold);border:0;padding:0 16px}
.chatnote{padding:0 14px 12px;color:#778797;font-size:9px}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#182535;border:1px solid var(--gold);padding:10px 16px;z-index:200;display:none}

@media(max-width:900px){
.cards{grid-template-columns:repeat(2,1fr)}
.nav{gap:12px}
.nav a{display:none}
.sourcegrid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:600px){
.hero{min-height:600px}
.stats{grid-template-columns:repeat(2,1fr)}
.stat:nth-child(2){border-right:0}
.stat:nth-child(-n+2){border-bottom:1px solid #ffffff16}
.cards{grid-template-columns:1fr}
.photo{height:235px}
.split{grid-template-columns:1fr;gap:30px}
.featureimg{min-height:270px}
.sectionhead{display:block}
.sectionhead h2{font-size:35px}
.sourcegrid{grid-template-columns:1fr 1fr}
section{padding:60px 0}
}
</style>
</head>
<body>
